# Local stand-ins for AWS managed services (demo only):
#   SeaweedFS (S3 API)          -> stands in for Amazon S3
#   Apache Iceberg REST catalog -> stands in for AWS Glue Data Catalog
# The pipeline code is identical; only PYICEBERG_CATALOG__* / S3 endpoint env vars differ.
apiVersion: v1
kind: Namespace
metadata:
  name: lakehouse-local
---
apiVersion: v1
kind: Secret
metadata:
  name: lake-credentials
  namespace: lakehouse-local
stringData:
  AWS_ACCESS_KEY_ID: local-dev
  AWS_SECRET_ACCESS_KEY: local-dev-secret-not-for-prod
  # SeaweedFS S3 identities (it rejects unknown access keys).
  s3.json: |
    {"identities": [{"name": "local", "actions": ["Admin", "Read", "Write", "List", "Tagging"],
      "credentials": [{"accessKey": "local-dev", "secretKey": "local-dev-secret-not-for-prod"}]}]}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seaweedfs
  namespace: lakehouse-local
spec:
  replicas: 1
  selector: { matchLabels: { app: seaweedfs } }
  template:
    metadata: { labels: { app: seaweedfs } }
    spec:
      containers:
        - name: seaweedfs
          image: chrislusf/seaweedfs:4.48
          args: ["server", "-s3", "-s3.config=/etc/seaweedfs/s3.json", "-dir=/data", "-ip.bind=0.0.0.0",
                 "-master.volumeSizeLimitMB=256", "-volume.max=50"]
          ports: [{ containerPort: 8333, name: s3 }]
          readinessProbe: { tcpSocket: { port: 8333 }, periodSeconds: 5 }
          resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { memory: 1Gi } }
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: s3-config, mountPath: /etc/seaweedfs, readOnly: true }
      volumes:
        - { name: data, emptyDir: {} }
        - { name: s3-config, secret: { secretName: lake-credentials, items: [{ key: s3.json, path: s3.json }] } }
---
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs
  namespace: lakehouse-local
spec:
  selector: { app: seaweedfs }
  ports: [{ port: 8333, targetPort: 8333, name: s3 }]
---
apiVersion: batch/v1
kind: Job
metadata:
  name: create-lake-bucket
  namespace: lakehouse-local
spec:
  backoffLimit: 20
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mkbucket
          image: corpreg:dev   # reuse the pipeline image: it already has pyarrow's S3 client
          imagePullPolicy: IfNotPresent
          envFrom: [{ secretRef: { name: lake-credentials } }]
          command:
            - python
            - -c
            - |
              import pyarrow.fs as fs
              s3 = fs.S3FileSystem(endpoint_override="seaweedfs:8333", scheme="http", region="us-east-1", allow_bucket_creation=True)
              s3.create_dir("lake"); print("bucket lake ready")
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: iceberg-rest
  namespace: lakehouse-local
spec:
  replicas: 1
  selector: { matchLabels: { app: iceberg-rest } }
  template:
    metadata: { labels: { app: iceberg-rest } }
    spec:
      containers:
        - name: iceberg-rest
          image: apache/iceberg-rest-fixture:1.10.1
          ports: [{ containerPort: 8181, name: http }]
          envFrom: [{ secretRef: { name: lake-credentials } }]
          env:
            - { name: AWS_REGION, value: us-east-1 }
            - { name: CATALOG_WAREHOUSE, value: "s3://lake/warehouse" }
            - { name: CATALOG_IO__IMPL, value: org.apache.iceberg.aws.s3.S3FileIO }
            - { name: CATALOG_S3_ENDPOINT, value: "http://seaweedfs.lakehouse-local.svc:8333" }
            - { name: CATALOG_S3_PATH__STYLE__ACCESS, value: "true" }
          readinessProbe: { httpGet: { path: /v1/config, port: 8181 }, periodSeconds: 5 }
          resources: { requests: { cpu: 100m, memory: 512Mi }, limits: { memory: 1Gi } }
---
apiVersion: v1
kind: Service
metadata:
  name: iceberg-rest
  namespace: lakehouse-local
spec:
  selector: { app: iceberg-rest }
  ports: [{ port: 8181, targetPort: 8181, name: http }]
