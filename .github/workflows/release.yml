# Application release: on merge to main, build the pipeline image and run it as a RayJob.
# Infrastructure is NOT touched here (see infra.yml): an app merge cannot change IAM or the cluster.
name: release

on:
  push:
    branches: [main]
    paths: ["app/**", "k8s/**", "scripts/ci/**", ".github/workflows/release.yml"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-main      # one pipeline run at a time; queued, never cancelled mid-run
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1

jobs:
  build:
    runs-on: ubuntu-latest
    if: vars.AWS_DEPLOY_ROLE_ARN != ''
    environment: dev
    outputs:
      image: ${{ steps.push.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - id: push
        env: { GIT_SHA: "${{ github.sha }}" }
        run: |
          eval "$(scripts/ci/env-from-ssm.sh)"
          scripts/ci/build-push.sh | tee build.log
          echo "image=$(grep '^IMAGE=' build.log | cut -d= -f2-)" >> "$GITHUB_OUTPUT"

  run-pipeline:
    needs: build
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - run: pip install pyyaml
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: submit RayJob and wait for the verdict
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          GIT_SHA: ${{ github.sha }}
          RUN_ID: gh-${{ github.run_id }}-${{ github.run_attempt }}
        run: scripts/ci/run-rayjob.sh
