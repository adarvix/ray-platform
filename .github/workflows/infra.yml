# Infrastructure release: apply layers in dependency order, behind a reviewer-gated environment.
# The plan that reviewers approved on the PR is re-planned here against current state, and the
# `infra-dev` environment requires a human approval before any apply runs.
name: infra

on:
  push:
    branches: [main]
    paths: ["infra/**", "scripts/ci/tf.sh"]
  workflow_dispatch:
    inputs:
      layer:
        description: "Single layer to apply (blank = all, in order)"
        required: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: infra-dev
  cancel-in-progress: false

env:
  TF_VERSION: 1.16.6
  AWS_REGION: ap-south-1

jobs:
  apply:
    if: vars.AWS_APPLY_ROLE_ARN != ''
    runs-on: ubuntu-latest
    environment: infra-dev    # required reviewers configured on this environment
    strategy:
      max-parallel: 1         # strictly sequential: later layers read earlier layers' outputs
      matrix:
        layer: [10-network, 20-eks, 30-data, 40-identity, 50-platform]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: inputs.layer == '' || inputs.layer == matrix.layer
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        if: inputs.layer == '' || inputs.layer == matrix.layer
        with: { terraform_version: "${{ env.TF_VERSION }}", terraform_wrapper: false }
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        if: inputs.layer == '' || inputs.layer == matrix.layer
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - if: inputs.layer == '' || inputs.layer == matrix.layer
        run: scripts/ci/tf.sh apply ${{ matrix.layer }}
