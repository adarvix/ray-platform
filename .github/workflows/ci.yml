# Pull requests: prove the change is safe before anyone merges it. Nothing here mutates AWS.
name: ci

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  TF_VERSION: 1.16.6
  AWS_REGION: ap-south-1

jobs:
  app:
    name: app tests + manifest render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
      - name: shellcheck
        run: docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:v0.11.0 -S warning scripts/ci/*.sh scripts/local/*.sh scripts/*.sh
      - name: render manifests (fails on unresolved vars)
        env: { LAKE_BUCKET: example-bucket, GLUE_DATABASE: corporate_registry }
        run: |
          python k8s/render.py --env aws --image example:sha --run-id pr-check > /dev/null
          python k8s/render.py --env aws --image example:sha --cron "0 2 * * *" > /dev/null

  image:
    name: image build + vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ github.run_id }}
          restore-keys: trivy-db-
      - run: scripts/ci/build-push.sh --no-push
        env: { GIT_SHA: "${{ github.sha }}" }

  terraform-static:
    name: terraform fmt / validate / misconfig scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with: { terraform_version: "${{ env.TF_VERSION }}" }
      - run: scripts/ci/tf.sh static
      - name: trivy config scan (HIGH/CRITICAL misconfigurations fail the build)
        run: |
          docker run --rm -v "$PWD:/src" aquasec/trivy:0.76.1 config --skip-dirs "**/.terraform" \
            --severity HIGH,CRITICAL --exit-code 1 --ignorefile /src/.trivyignore.yaml /src/infra

  terraform-plan:
    name: terraform plan (${{ matrix.layer }})
    # Requires the bootstrap + identity layers to exist. Skipped cleanly on forks / before setup.
    if: vars.AWS_PLAN_ROLE_ARN != ''
    needs: terraform-static
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write        # GitHub OIDC -> AWS: no stored AWS keys
      pull-requests: write   # post the plan on the PR
    strategy:
      fail-fast: false
      matrix:
        layer: [10-network, 20-eks, 30-data, 40-identity, 50-platform]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with: { terraform_version: "${{ env.TF_VERSION }}", terraform_wrapper: false }
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - run: scripts/ci/tf.sh plan ${{ matrix.layer }}
      - name: comment plan on PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const layer = '${{ matrix.layer }}';
            let plan = fs.readFileSync(`infra/${layer}/plan.txt`, 'utf8');
            if (plan.length > 60000) plan = plan.slice(0, 60000) + '\n... (truncated, see job log)';
            const marker = `<!-- tf-plan-${layer} -->`;
            const body = `${marker}\n#### terraform plan: \`${layer}\`\n<details><summary>show plan</summary>\n\n\`\`\`hcl\n${plan}\n\`\`\`\n</details>`;
            const { data: comments } = await github.rest.issues.listComments({ ...context.repo, issue_number: context.issue.number });
            const existing = comments.find(c => c.body.startsWith(marker));
            if (existing) await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            else await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
